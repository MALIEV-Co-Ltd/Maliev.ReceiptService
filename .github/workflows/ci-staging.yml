name: Validate - Staging

on:
  push:
    tags:
      - "release/v*"

permissions:
  contents: read

jobs:
  build-and-test:
    uses: ./.github/workflows/_build-and-test.yml
    with:
      solution_file: Maliev.ReceiptService.slnx
      extra_args: -p:SharedLibraryVersion=1.0.*-beta*
    secrets:
      gitops_pat: ${{ secrets.GITOPS_PAT }}
